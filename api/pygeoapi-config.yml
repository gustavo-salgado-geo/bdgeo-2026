# ==============================================================================
# CONFIGURAÇÃO GERAL DO SERVIDOR PYGEOAPI
# ==============================================================================
server:
  # Endereço IP e porta onde o serviço escutará internamente no container
  bind:
    host: 0.0.0.0
    port: 5000
    
  # URL pública oficial onde a API está publicada
  url: https://bdgeo-2026.onrender.com/
  
  # Idioma padrão da interface e respostas da API
  language: pt-BR
  # Idiomas suportados (evita avisos de 'unknown locale' nos logs)
  locales:
    - pt-BR
    
  # Formato de resposta padrão (GeoJSON / JSON) e codificação dos dados
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  
  # Provedor do mapa base exibido na interface Web da API
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    
  # Formatação legível (com indentação) nas respostas JSON
  pretty_print: true
  
  limits:
    default_items: 10       # Número padrão de registros por requisição
    max_items: 100          # Número máximo permitido de registros por requisição
    max_distance_x: 25      # Limite de busca no eixo X
    max_distance_y: 25      # Limite de busca no eixo Y
    max_distance_units: m   # Unidade de medida do limite espacial (metros)
    on_exceed: throttle     # throttle trunca os registros ao limite em vez de retornar erro

# Nível de detalhamento dos logs de execução (INFO, DEBUG, WARNING, ERROR)
logging:
  level: INFO

# ==============================================================================
# METADADOS GERAIS E INFORMAÇÕES DE CONTATO DA API
# ==============================================================================
metadata:
  # Identificação do serviço e palavras-chave de busca
  identification:
    title: Minha API OGC Features
    description: Camadas disponibilizadas via OGC Features
    keywords:
      - Municípios
      - Hidrografia
      - Desmatamento
      - União Europeia
      - CAR
      - IBGE
      - INPE
      - MMA
      - Vale do Paraíba e Litoral Norte
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://github.com/gustavo-salgado-geo/bdgeo-2026
  
  # Termos de licença de uso dos dados
  license:
    name: CC-BY 4.0 license
    url: https://creativecommons.org/licenses/by/4.0/
    
  # Entidade provedora do serviço
  provider:
    name: Instituto Nacional de Pesquisas Espaciais (INPE)
    url: https://bdgeo-2026.onrender.com/
  
  # Informações completas dos desenvolvedores/responsáveis pelo serviço
  contact:
    name: Carla Aparecida de Almeida Paula, Gustavo Piva Lopes Salgado e Mariana Guimarães Montoro Morais
    position: Desenvolvedores
    address: Av dos Astronautas, 1.758
    city: São José dos Campos
    stateorprovince: São Paulo
    postalcode: 12227-010
    country: Brasil
    phone: (12) 3208-6000
    fax: Não informado
    email: gustavo.salgado@inpe.br
    url: https://github.com/gustavo-salgado-geo/bdgeo-2026
    hours: Mo-Fr 08:00-17:00
    instructions: During hours of service
    role: pointOfContact
    
# ==============================================================================
# RECURSOS (RESOURCES): COLEÇÕES DE DADOS VETORIAIS E PROCESSOS
# ==============================================================================
resources:
  
  # ----------------------------------------------------------------------------
  # Coleção: Municípios
  # ----------------------------------------------------------------------------
  municipios:
    type: collection # Define a entidade como conjunto de dados geográficos
    title: municipios
    description: Municípios do Vale do Paraíba e Litoral Norte
    keywords:
      - Municípios
      - Vale do Paraíba
      - Litoral Norte
      - IBGE
      - 2025
    # Link de acesso direto à coleção na API
    links:
      - type: text/html
        rel: canonical
        title: Página da coleção
        href: https://bdgeo-2026.onrender.com/collections/municipios
        hreflang: pt-BR
    # Sistemas de Referência de Coordenadas suportados para reprojeção dinâmica
    crs:
      - http://www.opengis.net/def/crs/OGC/1.3/CRS84
      - http://www.opengis.net/def/crs/EPSG/0/4674
    # Limites geográficos da coleção (Bounding Box: [Xmin, Ymin, Xmax, Ymax])
    extents:
      spatial:
        bbox: [-46.2634585999999999,-24.1132837000000002, -44.1613651999999988,-22.4038478999999988]
        crs: http://www.opengis.net/def/crs/EPSG/0/4674
    # Configuração de leitura dos dados via driver GDAL/OGR
    providers:
      - type: feature
        name: OGR # Motor de conexão vetorial OGR
        data:
          source_type: SQLite      # Formato do arquivo físico contendo as tabelas
          source: /app/bdgeo26.db  # Caminho absoluto do banco dentro da imagem Docker
        layer: municipios          # Nome da tabela dentro do banco SQLite
        crs:
          - http://www.opengis.net/def/crs/OGC/1.3/CRS84
          - http://www.opengis.net/def/crs/EPSG/0/4674
        storage_crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84  # Sistema de coordenadas original armazenado
        id_field: fid # Coluna da Chave Primária utilizada para busca por ID
        # Lista dos atributos da tabela expostos no JSON final com metadados
        properties:
          cd_mun:
            title: Código do Município
            type: string
            description: Código de 7 dígitos do município segundo o IBGE
          nm_mun:
            title: Nome do Município
            type: string
            description: Nome oficial do município
          cd_rgi:
            title: Código da Região Geográfica Imediata
            type: string
          nm_rgi:
            title: Região Geográfica Imediata
            type: string
          cd_rgint:
            title: Código da Região Geográfica Intermediária
            type: string
          nm_rgint:
            title: Região Geográfica Intermediária
            type: string
          cd_uf:
            title: Código da UF
            type: string
            description: Código numérico da Unidade da Federação
          nm_uf:
            title: Nome da UF
            type: string
            description: Nome da Unidade da Federação
          sigla_uf:
            title: Sigla da UF
            type: string
          cd_regiao:
            title: Código da Região
            type: string
          nm_regiao:
            title: Nome da Região
            type: string
          sigla_rg:
            title: Sigla da Região
            type: string
          cd_concurb:
            title: Código de Concentração Urbana
            type: string
          nm_concurb:
            title: Concentração Urbana
            type: string
          area_km2:
            title: Área Territorial
            type: number
            x-ogc-unit: km2
            description: Área territorial do município em quilômetros quadrados
        
